version = 0.1

[default.global.parameters]
stack_name = "lambda-demo-09-github-webhook"
profile = "personal"
region = "ap-southeast-2"

[default.deploy.parameters]
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
# Repo whose workflow gets dispatched (needs `on: workflow_dispatch`)
parameter_overrides = "GithubRepo=\"KhetwalDevesh/aws-lambda-demos\""
